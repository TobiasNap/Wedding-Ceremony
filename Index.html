<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wedding Ceremony</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Georgia, serif;
      background: #fafafa;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: auto;
      padding: 24px;
    }
    h1, h2 {
      text-align: center;
    }
    .language {
      margin-top: 40px;
    }
    hr {
      margin: 40px 0;
      border: none;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Wedding Ceremony</h1>
  <p style="text-align:center;">Welcome — please scroll for the translation</p>

  <div class="language">
    <h2>Original Text</h2>
    <p>
      Dear friends and family,<br><br>
      We are gathered here today to celebrate the love between…
    </p>
  </div>

  <hr>

  <div class="language">
    <h2>Translation</h2>
    <p>
      Lieve vrienden en familie,<br><br>
      We zijn hier vandaag samengekomen om de liefde te vieren tussen…
    </p>
  </div>
</div>

</body>
</html>
